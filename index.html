<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MathJax pour les formules math&#233;matiques &#233;l&#233;gantes -->
    <!-- MathJax config (AVANT le chargement de MathJax) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>

    <!-- MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Mobile Header -->
    <div class="md:hidden bg-zinc-900 text-white p-4 flex justify-between items-center z-30 shadow-md flex-shrink-0 border-b border-zinc-800">
        <span class="font-bold text-lg flex items-center gap-2">
            <svg class="dma-brain" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <g class="dma-brain-lobes">
                    <path d="M15 5.6c-2.5 0-4.1 1.5-4.4 3.3-1.9.5-3.3 2-3.3 4 0 1.1.4 2.1 1.2 2.8-.6.7-1 1.5-1 2.5 0 1.8 1.3 3.3 3.2 3.6.3 1.9 1.9 3.4 4.3 3.4" />
                    <path d="M17 5.6c2.5 0 4.1 1.5 4.4 3.3 1.9.5 3.3 2 3.3 4 0 1.1-.4 2.1-1.2 2.8.6.7 1 1.5 1 2.5 0 1.8-1.3 3.3-3.2 3.6-.3 1.9-1.9 3.4-4.3 3.4" />
                </g>
                <path class="dma-brain-synapses" d="M16 9.4 11.8 12.9M16 9.4l4.2 3.5M11.8 12.9v5M20.2 12.9v5M11.8 17.9 16 21.4M20.2 17.9 16 21.4M16 9.4v12" />
                <g class="dma-brain-nodes">
                    <circle cx="16" cy="9.4" r="1.7" /><circle cx="11.8" cy="12.9" r="1.4" />
                    <circle cx="20.2" cy="12.9" r="1.4" /><circle cx="11.8" cy="17.9" r="1.4" />
                    <circle cx="20.2" cy="17.9" r="1.4" /><circle cx="16" cy="21.4" r="1.7" />
                </g>
            </svg>
            Deep Academy
        </span>
        <button onclick="toggleSidebar()" class="p-2 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7">
                </path>
            </svg>
        </button>
    </div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar"
        class="fixed md:relative inset-y-0 left-0 w-80 bg-zinc-900 text-white flex flex-col flex-shrink-0 shadow-2xl z-40 transform transition-transform duration-300 -translate-x-full md:translate-x-0 h-full border-r border-zinc-800">
        <div class="p-4 bg-zinc-800 font-bold text-xl hidden md:flex items-center gap-3 shadow-lg shrink-0 border-b border-zinc-700">
            <svg class="dma-brain" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <g class="dma-brain-lobes">
                    <path d="M15 5.6c-2.5 0-4.1 1.5-4.4 3.3-1.9.5-3.3 2-3.3 4 0 1.1.4 2.1 1.2 2.8-.6.7-1 1.5-1 2.5 0 1.8 1.3 3.3 3.2 3.6.3 1.9 1.9 3.4 4.3 3.4" />
                    <path d="M17 5.6c2.5 0 4.1 1.5 4.4 3.3 1.9.5 3.3 2 3.3 4 0 1.1-.4 2.1-1.2 2.8.6.7 1 1.5 1 2.5 0 1.8-1.3 3.3-3.2 3.6-.3 1.9-1.9 3.4-4.3 3.4" />
                </g>
                <path class="dma-brain-synapses" d="M16 9.4 11.8 12.9M16 9.4l4.2 3.5M11.8 12.9v5M20.2 12.9v5M11.8 17.9 16 21.4M20.2 17.9 16 21.4M16 9.4v12" />
                <g class="dma-brain-nodes">
                    <circle cx="16" cy="9.4" r="1.7" /><circle cx="11.8" cy="12.9" r="1.4" />
                    <circle cx="20.2" cy="12.9" r="1.4" /><circle cx="11.8" cy="17.9" r="1.4" />
                    <circle cx="20.2" cy="17.9" r="1.4" /><circle cx="16" cy="21.4" r="1.7" />
                </g>
            </svg>
            <span>Deep Academy</span>
        </div>

        <!-- Course Selector -->
        <div class="p-4 border-b border-zinc-800 bg-zinc-800/40 shrink-0">
            <label class="text-xs text-zinc-400 uppercase font-bold tracking-wider">Mati&#232;re</label>
            <div id="courseSelectorWrapper" class="relative z-50">
                <!-- Custom Selector injected by JS -->
            </div>
        </div>

        <div class="p-3 border-b border-zinc-800 bg-zinc-900/40 shrink-0">
            <label for="globalSearchInput" class="text-xs text-zinc-400 uppercase font-bold tracking-wider">Recherche globale</label>
            <div class="mt-2 relative">
                <input id="globalSearchInput" type="search" placeholder="Cours, chapitre, concept, equation..."
                    class="w-full rounded-lg border border-zinc-700 bg-zinc-950/70 text-white placeholder-zinc-500 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400">
                <button id="globalSearchClear" type="button"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-lg leading-none hidden"
                    aria-label="Effacer la recherche">x</button>
            </div>
            <div id="globalSearchStatus" class="mt-1 text-[11px] text-zinc-500 min-h-[1rem]"></div>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="nav-container">
            <!-- Navigation items injected here -->
        </div>

    </nav>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"
        class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden glass"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden relative bg-gray-50 w-full">
        <!-- Header -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10 border-b sticky top-0 shrink-0">
            <h1 class="text-lg md:text-2xl font-bold text-indigo-700 flex items-center gap-2 truncate"
                id="chapter-title">
                <!-- Title injected here -->
            </h1>
            <div class="flex gap-2 shrink-0">
                <button id="darkModeBtn" onclick="toggleDarkMode()"
                    class="text-xl px-2 py-1 rounded hover:bg-gray-100 transition">&#127769;</button>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 pb-24 scroll-smooth">
            <!-- Content injected here via JS -->
        </div>

        <!-- Toast Notification -->
        <div id="toast"
            class="fixed bottom-6 right-6 bg-green-500 text-white px-6 py-3 rounded-lg shadow-xl transform translate-y-32 transition-transform duration-300 font-bold z-50 flex items-center gap-2">
            <span>&#9989;</span> <span id="toast-msg">Bonne r&#233;ponse !</span>
        </div>
    </main>

    <!-- Home Screen Overlay -->
    <div id="home-screen"
        class="fixed inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-start lg:justify-center overflow-y-auto text-white transition-opacity duration-1000"
        style="background-color: #131316;">
        <!-- Background Animation Canvas -->
        <canvas id="home-bg-canvas" class="absolute inset-0 w-full h-full"></canvas>

        <!-- Content -->
        <div class="relative z-10 text-center space-y-8 p-6 my-auto">
            <div class="mb-4 flex justify-center">
                <svg class="dma-brain dma-brain-hero" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <g class="dma-brain-lobes">
                        <path d="M15 5.6c-2.5 0-4.1 1.5-4.4 3.3-1.9.5-3.3 2-3.3 4 0 1.1.4 2.1 1.2 2.8-.6.7-1 1.5-1 2.5 0 1.8 1.3 3.3 3.2 3.6.3 1.9 1.9 3.4 4.3 3.4" />
                        <path d="M17 5.6c2.5 0 4.1 1.5 4.4 3.3 1.9.5 3.3 2 3.3 4 0 1.1-.4 2.1-1.2 2.8.6.7 1 1.5 1 2.5 0 1.8-1.3 3.3-3.2 3.6-.3 1.9-1.9 3.4-4.3 3.4" />
                    </g>
                    <path class="dma-brain-synapses" d="M16 9.4 11.8 12.9M16 9.4l4.2 3.5M11.8 12.9v5M20.2 12.9v5M11.8 17.9 16 21.4M20.2 17.9 16 21.4M16 9.4v12" />
                    <g class="dma-brain-nodes">
                        <circle cx="16" cy="9.4" r="1.7" /><circle cx="11.8" cy="12.9" r="1.4" />
                        <circle cx="20.2" cy="12.9" r="1.4" /><circle cx="11.8" cy="17.9" r="1.4" />
                        <circle cx="20.2" cy="17.9" r="1.4" /><circle cx="16" cy="21.4" r="1.7" />
                    </g>
                </svg>
            </div>
            <h1
                class="text-5xl md:text-7xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-zinc-100 via-cyan-300 to-teal-400 drop-shadow-lg tracking-tight">
                Deep Academy
            </h1>
            <p class="text-xl md:text-2xl text-zinc-300 max-w-2xl mx-auto font-light leading-relaxed">
                Des premiers symboles math&#233;matiques aux fronti&#232;res de la recherche.<br>
                <span class="text-cyan-400 font-medium">Comprendre en profondeur, une notion &#224; la fois.</span>
            </p>

            <button onclick="enterApp()"
                class="group relative px-8 py-4 bg-white text-zinc-900 font-bold text-xl rounded-full shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_40px_rgba(255,255,255,0.6)] hover:scale-105 transition-all duration-300 overflow-hidden">
                <span class="relative z-10 flex items-center gap-3">
                    Commencer l'Aventure <span class="group-hover:translate-x-1 transition-transform">&#10140;</span>
                </span>
                <div
                    class="absolute inset-0 bg-gradient-to-r from-zinc-100 to-cyan-100 opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
            </button>

            <div class="max-w-3xl mx-auto">
                <p class="text-xs uppercase tracking-wider text-zinc-400 mb-3">Parcours disponibles</p>
                <!-- Genere depuis courses_config.json : tout nouveau cours apparait ici tout seul -->
                <div id="home-courses" class="grid md:grid-cols-3 gap-3 text-left"></div>
            </div>
        </div>

        <div class="absolute bottom-8 text-gray-500 text-sm font-mono">
            v2.0 &#8226; Interactive Learning Platform by INFINITION
        </div>
    </div>

    <script src="data/content_bundle.js"></script>
    <script src="js/pedagogy.js"></script>
    <script src="js/global.js"></script>
    <script src="js/basics.js"></script>
    <script src="js/algebra.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/ai_dynamics.js"></script>
    <script src="js/ml_expert.js"></script>
    <script src="js/quantum.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/derivee_interactive.js"></script>

</body>

</html>
